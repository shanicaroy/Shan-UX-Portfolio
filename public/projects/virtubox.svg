<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200">
  <!-- VirtuBox kiosk — abstract schematic of a freestanding wayfinding kiosk.
       Shapes only: a cover illustration, not a product screen. -->
  <rect width="1600" height="1200" fill="#F5F3EE"/>
  <!-- floor -->
  <rect x="0" y="1010" width="1600" height="190" fill="#EAE8E1"/>
  <ellipse cx="800" cy="1050" rx="360" ry="34" fill="#DCD9D2"/>
  <!-- pedestal -->
  <rect x="740" y="760" width="120" height="280" rx="14" fill="#FFFFFF" stroke="#E3E1DB" stroke-width="3"/>
  <rect x="660" y="1016" width="280" height="34" rx="17" fill="#FFFFFF" stroke="#E3E1DB" stroke-width="3"/>
  <!-- screen enclosure, gently tilted -->
  <g transform="rotate(-4 800 520)">
    <rect x="330" y="270" width="940" height="540" rx="34" fill="#FFFFFF" stroke="#E3E1DB" stroke-width="4"/>
    <rect x="374" y="314" width="852" height="452" rx="16" fill="#E4EFEE"/>
    <!-- floor-plan blob -->
    <path d="M470 560 L560 470 L700 470 L760 410 L920 410 L960 470 L940 560 L850 610 L700 640 L560 640 Z"
          fill="#FFFFFF" stroke="#B9D8D5" stroke-width="4"/>
    <path d="M700 470 L760 410 L920 410 L960 470 L940 560 L850 610 L760 560 Z" fill="#CFE4E2"/>
    <!-- highlighted rooms -->
    <rect x="806" y="440" width="66" height="46" rx="8" fill="#0B6E6B"/>
    <rect x="700" y="500" width="56" height="40" rx="8" fill="#0B6E6B" opacity="0.55"/>
    <!-- you-are-here pin -->
    <circle cx="600" cy="540" r="16" fill="#B0651F"/>
    <path d="M600 540 L600 586" stroke="#B0651F" stroke-width="6" stroke-linecap="round"/>
    <!-- side panel of destinations -->
    <rect x="1006" y="352" width="182" height="376" rx="12" fill="#FFFFFF" stroke="#B9D8D5" stroke-width="3"/>
    <g>
      <rect x="1026" y="376" width="142" height="34" rx="8" fill="#E4EFEE"/>
      <rect x="1026" y="422" width="142" height="34" rx="8" fill="#E4EFEE"/>
      <rect x="1026" y="468" width="142" height="34" rx="8" fill="#0B6E6B"/>
      <rect x="1026" y="514" width="142" height="34" rx="8" fill="#E4EFEE"/>
      <rect x="1026" y="560" width="142" height="34" rx="8" fill="#E4EFEE"/>
      <rect x="1026" y="606" width="142" height="34" rx="8" fill="#E4EFEE"/>
    </g>
    <!-- bottom action row -->
    <g>
      <circle cx="740" cy="716" r="22" fill="#FFFFFF" stroke="#0B6E6B" stroke-width="4"/>
      <circle cx="806" cy="716" r="22" fill="#FFFFFF" stroke="#0B6E6B" stroke-width="4"/>
      <circle cx="872" cy="716" r="22" fill="#FFFFFF" stroke="#0B6E6B" stroke-width="4"/>
    </g>
  </g>
</svg>
